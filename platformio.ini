; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F407VGT6]
platform = ststm32
board = genericSTM32F407VGT6
framework = arduino
;lib_deps = 
	
	;jgromes/RadioLib@^7.1.2
	;nrf24/RF24@^1.4.8
; ------------------------------------------------------------------------------
; Build Flags Configuration
; ------------------------------------------------------------------------------
build_flags =

   
    ; 1. Disable STM32Duino Arduino HardwareTimer IRQ Handlers
    ; Prevents multiple definition errors for TIM2_IRQHandler, TIM3_IRQHandler, etc.
    -D HAL_TIM_MODULE_ONLY
    -D HAL_EXTI_MODULE_DISABLED
    ; 2. Clock & Crystal Configuration
    ; Sets HSE (External Crystal) to 8 MHz. Match this to your board's physical oscillator.
    -D HSE_VALUE=8000000UL
    
    ; 3. Maximum Speed Compiler Optimizations (-O3)
    ; Critical for time-sensitive bit-banging, raster generation, and interrupt execution.
    -O3
    -flto                       ; Link-Time Optimization for tight inline function expanding
    
    ; 4. Hardware Floating Point Unit (FPU) Configuration
    ; Enables hardware single-precision float support for fast 3D graphics calculations.
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16

; ------------------------------------------------------------------------------
; Build & Linker Options
; ------------------------------------------------------------------------------
; Retain link-time optimizations during executable linking stage
extra_scripts = 

; ------------------------------------------------------------------------------
; Upload & Debug Protocol Configuration
; ------------------------------------------------------------------------------
upload_protocol = stlink
debug_tool = stlink

; Uncomment if uploading via USB DFU Bootloader instead of ST-Link:
; upload_protocol = dfu

; Serial Monitor Baud Rate for debugging output
monitor_speed = 115200

